name: Build model release bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-release.txt
          sudo apt-get update
          sudo apt-get install -y ghdl
      - name: Test, train, and package
        run: |
          make test
          make asan
          make download
          make train
          make verify-trained
          make evaluate
          make release
      - uses: actions/upload-artifact@v4
        with:
          name: cnn-from-scratch-v0.1.0-model
          path: build/release/*
          if-no-files-found: error
