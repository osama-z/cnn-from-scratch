name: Verify software and RTL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ghdl
      - name: Verify software, gradients, model export, and RTL
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: make test
      - name: Check memory safety
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: make asan
      - name: Check frozen model reproducibility
        run: |
          make -C lessons/day7 model
          git diff --exit-code -- lessons/day7/weights.bin lessons/day7/reference_io.txt lessons/day7/vhdl_vectors
